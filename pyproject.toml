[project]
name = "openpath"
version = "0.1.0"
description = "Local-first, TUI-first, evidence-driven opportunity research engine for India."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "OpenPath contributors" }]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "lxml>=6.0,<7",
    "pydantic>=2.11,<3",
    "textual>=8.0,<9",
    "trafilatura>=2.0,<3",
    "typer>=0.20,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[project.scripts]
openpath = "openpath.cli:run_cli"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.0,<2",
    "pyright>=1.1.400",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openpath"]

[tool.hatch.build.targets.sdist]
include = ["src/openpath", "tests", "docs", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "live: tests that contact a real public endpoint (not run by default)",
    "slow: slow tests",
]
